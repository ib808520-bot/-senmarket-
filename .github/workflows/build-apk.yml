name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Capacitor project
        run: |
          rm -rf android
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android --save || true
          npx cap init SenMarket com.senmarket.app --web-dir=. --npm-client npm || true
          npx cap add android || true
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          echo "ext { }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          npx cap sync android || true
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senmarket-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
